AWSTemplateFormatVersion: '2010-09-09'
Description: CI/CD Pipeline for Churn Segmentation Data Pipeline

Resources:
  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: ChurnSegmentationPipeline
      RoleArn: !ImportValue ChurnSegmentation-CodePipelineRoleArn
      ArtifactStore:
        Type: S3
        Location: !ImportValue ChurnSegmentation-PipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: 1
              Configuration:
                RepositoryName: churn-segmentation-repo
                BranchName: main
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !ImportValue ChurnSegmentation-CodeBuildProjectName