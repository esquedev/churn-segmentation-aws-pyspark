AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation template for the Staging Data S3 Bucket for the Churn Segmentation Data
  Pipeline.This bucket is used as a temporary staging area for data in transit or being 
  processed.

Metadata:
  Project: ChurnSegmentationPySpark
  Component: StagingDataBucket

Parameters:
  ProjectName:
    Type: String
    Description: Name of the project, used for resource naming.
    Default: churn-segmentation

  Environment:
    Type: String
    Description: Environment (e.g., dev, test, prod).
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  BucketNameSuffix:
    Type: String
    Description: >
      A unique suffix for the S3 bucket name. This helps ensure global uniqueness.
      e.g., YourProjectName-Environment-staging-[suffix]
    Default: !Select [2, !Split ['-', !Select [0, !Split ['/', !Ref "AWS::StackId"]]]]

Resources:
  StagingDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain # Retain for safety, though data is typically temporary
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-staging-${BucketNameSuffix}"
      VersioningConfiguration:
        Status: Enabled # Recommended for staging to recover from accidental deletions or overwrites
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256 # Always encrypt at rest
      # Lifecycle Rules are highly recommended for staging to manage costs and data retention
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldStagingData
            Status: Enabled
            ExpirationInDays: 7 # Delete objects after 7 days
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: DataTier
          Value: Staging
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  StagingDataBucketName:
    Description: The name of the S3 bucket used for staging data.
    Value: !Ref StagingDataBucket
    Export:
      Name: !Sub "${ProjectName}-${Environment}-StagingDataBucketName"

  StagingDataBucketArn:
    Description: The ARN of the S3 bucket used for staging data.
    Value: !GetAtt StagingDataBucket.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-StagingDataBucketArn"