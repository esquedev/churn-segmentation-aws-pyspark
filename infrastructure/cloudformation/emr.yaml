AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation template for AWS EMR cluster for Churn Segmentation Data Pipeline.
  Deploys an EMR cluster with PySpark for distributed data processing.

Metadata:
  Project: ChurnSegmentationPySpark
  Component: EMRCluster

Parameters:
  ProjectName:
    Type: String
    Description: Name of the project, used for resource naming.
    Default: churn-segmentation

  Environment:
    Type: String
    Description: Environment (e.g., dev, test, prod).
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  KeyName:
    Type: String
    Description: EC2 Key Pair name for SSH access to the EMR cluster.
    ConstraintDescription: Must be an existing EC2 Key Pair

  InstanceCount:
    Type: Number
    Default: 3
    Description: Number of EC2 instances for the EMR cluster (1 master + N worker nodes)
    MinValue: 1

  InstanceType:
    Type: String
    Default: m5.xlarge
    Description: EC2 instance type for EMR cluster nodes
    AllowedValues:
      - m5.large
      - m5.xlarge
      - m5.2xlarge
      - m5.4xlarge

Resources:
  EMRClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-emr-cluster-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonElasticMapReduceforEC2Role
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-*"
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-*/*"

  EMRServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-emr-service-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticmapreduce.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonElasticMapReduceRole

  EMRClusterInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EMRClusterRole

  EMRSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EMR cluster
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access

Outputs:
  EMRClusterRoleArn:
    Description: ARN of the EMR cluster IAM role
    Value: !GetAtt EMRClusterRole.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-EMRClusterRoleArn"

  EMRServiceRoleArn:
    Description: ARN of the EMR service IAM role
    Value: !GetAtt EMRServiceRole.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-EMRServiceRoleArn"

  EMRInstanceProfileArn:
    Description: ARN of the EMR instance profile
    Value: !GetAtt EMRClusterInstanceProfile.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-EMRInstanceProfileArn"
